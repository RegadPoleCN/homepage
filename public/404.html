<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 - 页面未找到</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #f1f5f9;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
    }
    .container {
      text-align: center;
      max-width: 480px;
    }
    .error-code {
      font-size: 8rem;
      font-weight: 700;
      color: #60a5fa;
      line-height: 1;
      margin-bottom: 1rem;
      text-shadow: 0 0 40px rgba(96, 165, 250, 0.3);
    }
    .error-title {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 0.75rem;
    }
    .error-desc {
      font-size: 0.9375rem;
      color: #94a3b8;
      margin-bottom: 2rem;
      line-height: 1.6;
    }
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 1.5rem;
      background: #60a5fa;
      color: #0f172a;
      text-decoration: none;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.9375rem;
      transition: all 0.2s ease;
    }
    .back-link:hover {
      background: #818cf8;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="error-code">404</div>
    <h1 class="error-title">页面未找到</h1>
    <p class="error-desc">抱歉，您访问的页面不存在或已被移除。请检查 URL 是否正确，或返回首页。</p>
    <a href="/" class="back-link">← 返回首页</a>
  </div>
</body>
</html>
