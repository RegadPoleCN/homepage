<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>离线模式</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #f1f5f9;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
    }
    .container {
      text-align: center;
      max-width: 480px;
    }
    .offline-icon {
      font-size: 4rem;
      margin-bottom: 1.5rem;
      opacity: 0.7;
    }
    .offline-title {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 0.75rem;
    }
    .offline-desc {
      font-size: 0.9375rem;
      color: #94a3b8;
      margin-bottom: 2rem;
      line-height: 1.6;
    }
    .retry-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 1.5rem;
      background: #60a5fa;
      color: #0f172a;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.9375rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .retry-btn:hover {
      background: #818cf8;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="offline-icon">📡</div>
    <h1 class="offline-title">当前处于离线状态</h1>
    <p class="offline-desc">您似乎已断开网络连接。部分内容可能无法正常显示，请检查网络连接后重试。</p>
    <button class="retry-btn" onclick="window.location.reload()">↻ 重新加载</button>
  </div>
</body>
</html>
