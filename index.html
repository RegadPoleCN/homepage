<!doctype html>
<html lang="zh-CN">
  <head>
    <script>
      (function(){try{var t=localStorage.getItem('homepage-theme');if(t){document.documentElement.setAttribute('data-theme',t)}else if(window.matchMedia('(prefers-color-scheme: light)').matches){document.documentElement.setAttribute('data-theme','light')}}catch(e){}})();
    </script>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Theme Color (支持 light/dark 模式) -->
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)" />

    <!-- PWA & Apple Web App Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Homepage" />

    <!-- Security & Privacy Meta Tags -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="format-detection" content="telephone=no" />

    <!-- DNS Prefetch & Preconnect for Icons -->
    <link rel="dns-prefetch" href="//api.iconify.design" />
    <link rel="preconnect" href="https://api.iconify.design" crossorigin />
    <link rel="dns-prefetch" href="//cdn.jsdelivr.net" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="dns-prefetch" href="//avatars.githubusercontent.com" />
    <link rel="preconnect" href="https://avatars.githubusercontent.com" crossorigin />

    <!-- Iconify API Configuration for faster icon loading -->
    <script>
      // Configure Iconify to use multiple API sources for reliability
      window.__IconifyConfig = {
        defaultAPI: 'https://api.iconify.design',
        api: {
          '': {
            resources: ['https://api.iconify.design', 'https://api.unisvg.com'],
          },
        },
      };
    </script>

    <!-- SEO Meta Tags (injected at build time, overridable at runtime by JS) -->
    <title>__SEO_TITLE__</title>
    <meta name="description" content="__SEO_DESCRIPTION__" />
    <meta name="keywords" content="__SEO_KEYWORDS__" />
    <meta name="author" content="__SEO_AUTHOR__" />

    <!-- Open Graph Meta Tags -->
    <meta property="og:title" content="__SEO_TITLE__" />
    <meta property="og:description" content="__SEO_DESCRIPTION__" />
    <meta property="og:image" content="__SEO_OG_IMAGE__" />
    <meta property="og:url" content="__SEO_CANONICAL__" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="zh_CN" />

    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="__SEO_TITLE__" />
    <meta name="twitter:description" content="__SEO_DESCRIPTION__" />
    <meta name="twitter:image" content="__SEO_TWITTER_IMAGE__" />

    <!-- Canonical URL -->
    <link rel="canonical" href="__SEO_CANONICAL__" />

    <!-- hreflang Tags -->
    <link rel="alternate" hreflang="zh-Hans-CN" href="__SEO_HREFLANG_URL__" />
    <link rel="alternate" hreflang="x-default" href="__SEO_HREFLANG_URL__" />

    <!-- Content Security Policy (CSP) - style-src 'unsafe-inline' required for Vue scoped styles -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.busuanzi.cc blob:; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https:; connect-src 'self' https://api.iconify.design https://api.unisvg.com https://api.simplesvg.com https://cdn.jsdelivr.net https://cdn.busuanzi.cc__UPTIME_KUMA_CSP__;" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
